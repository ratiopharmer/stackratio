  .tab:hover, .opt:hover, .tab.on, .opt.on { color: var(--fg); }
  /* Selected choice: same glowing dot as the nav */
  .tab::after, .opt::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 3px; height: 3px; border-radius: 50%;
    background: var(--fg); box-shadow: 0 0 8px 1px rgba(255,255,255,.6); transform: translateX(-50%) scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  .tab.on::after, .opt.on::after { transform: translateX(-50%) scale(1); }
  .calc { display: none; }
  .calc.on { display: block; }

  /* Result first: the number you need, then what it means */
  .out { margin-bottom: 34px; }
  .res { color: var(--dim); }
  .res b { display: block; margin-top: 2px; font-weight: 500; font-size: 40px; line-height: 1.1; color: var(--fg); font-variant-numeric: tabular-nums; }
  .res b em { font-style: normal; font-weight: 400; font-size: 14px; color: var(--dim); margin-left: 6px; }
  .sub { display: flex; gap: 28px; margin-top: 14px; color: var(--dim); }
  .sub span b { display: block; font-weight: 400; color: var(--fg); font-variant-numeric: tabular-nums; }
  .warn { margin-top: 12px; color: var(--warn); }
  .warn:empty { display: none; }

  /* Inputs: label (with its unit) on the left, plain numbers on the right */
  .f { display: grid; grid-template-columns: 128px 1fr; align-items: baseline; gap: 4px 16px; padding: 9px 0; }
  .q { color: var(--dim); }
  .q i { font-style: normal; opacity: .55; margin-left: 4px; }
  .opts { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; font-variant-numeric: tabular-nums; }
  .num { width: 64px; border-bottom: 1px solid var(--dim); outline: none; font-variant-numeric: tabular-nums; }
  .num:focus { border-color: var(--fg); }
  .num[hidden] { display: none; }
  @media (max-width: 420px) { .f { grid-template-columns: 1fr; } }

  /* 1.0 ml syringe as a single line: track and fill up to the result */
  .syr { position: relative; margin-top: 22px; height: 1px; background: #333; }
  .fill { position: absolute; inset: -1px 0; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .7s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 10px 1px rgba(var(--c-pep), .6); }
  .scale { display: flex; justify-content: space-between; margin-top: 6px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }

<script src="field.js?v=32"></script>
<script>
// Syringe is always 1.0 ml = 100 units (U-100).
const UNITS_PER_ML = 100;
const fmt = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('en-US');
const state = { vial: 10, water: 2, dose: 250, conc: 250, week: 500, freq: 2, vialml: 10 };

document.querySelectorAll('.opts').forEach((box) => {
  const k = box.dataset.k, input = box.querySelector('.num');
  const on = box.querySelector('.opt.on');
  if (on) state[k] = parseFloat(on.dataset.v);
  box.addEventListener('click', (e) => {
    const b = e.target.closest('.opt');
    if (!b) return;
    box.querySelectorAll('.opt').forEach((x) => x.classList.toggle('on', x === b));
    if (b.dataset.v === 'other') { input.hidden = false; input.focus(); state[k] = parseFloat(input.value) || 0; }
    else { if (input) input.hidden = true; state[k] = parseFloat(b.dataset.v); }
    calc();
  });
  if (input) input.addEventListener('input', () => { state[k] = parseFloat(input.value) || 0; calc(); });
});

function show (p, units, extra) {
  const ok = isFinite(units) && units > 0;
  const u = document.getElementById(p + '-u'), html = ok ? `${fmt(units, 1)} <em>${Math.round(units * 10) === 10 ? 'unit' : 'units'}</em>` : '–';
  if (u.innerHTML !== html) { u.innerHTML = html; u.animate?.([{ opacity: .3, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' }); }
  document.getElementById(p + '-fill').style.transform = 'scaleX(' + (ok ? Math.min(units, 100) / 100 : 0) + ')';
  document.getElementById(p + '-warn').textContent = ok && units > 100 ? 'More than one 1.0 ml syringe – split it across several draws or injections.' :
    ok && units < 2 ? 'Below 2 units is hard to read accurately – use more water.' : (extra || '');
}

function calc () {
  // Peptide: concentration (mcg/ml) = vial mg × 1000 / water ml
  const conc = state.vial * 1000 / state.water;
  const ml = state.dose / conc;
  document.getElementById('pep-ml').textContent = isFinite(ml) ? fmt(ml, 3) + ' ml' : '–';
  document.getElementById('pep-conc').textContent = isFinite(conc) ? fmt(conc, 0) + ' mcg/ml' : '–';
  document.getElementById('pep-n').textContent = isFinite(conc) && state.dose ? fmt(state.vial * 1000 / state.dose, 1) : '–';
  show('pep', ml * UNITS_PER_ML);

  // Testosterone: mg per injection = weekly / frequency; ml = mg / concentration
  const mg = state.week / state.freq;
  const tml = mg / state.conc;
  document.getElementById('t-mg').textContent = isFinite(mg) ? fmt(mg, 1) + ' mg' : '–';
  document.getElementById('t-ml').textContent = isFinite(tml) ? fmt(tml, 3) + ' ml' : '–';
  const weeks = state.vialml * state.conc / state.week;
  document.getElementById('t-wk').textContent = isFinite(weeks) && weeks > 0 ? fmt(weeks, 1) + ' weeks' : '–';
  show('t', tml * UNITS_PER_ML);
}

document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  document.querySelectorAll('.calc').forEach((c) => c.classList.toggle('on', c.id === t.dataset.t));
}));
calc();
</script>
